name: Security scan
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit -r requirements.txt --no-deps --disable-pip --strict
      - if: always()
        run: bandit -q -r home config -x home/migrations -ll -ii
