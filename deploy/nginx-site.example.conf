# EXAMPLE ONLY. Adapt after auditing the actual ingress. Never overwrite Mailcow config.
# Apply via the existing ingress's persistent supported configuration mechanism.
# This is an HTTP starting point, not a claim that TLS has been issued.
server {
    listen 80;
    server_name kfata.elsaidy.org;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 50s;
    }
}
