server {
    listen 443 ssl;
    server_name kfata.elsaidy.org;
    ssl_certificate /etc/letsencrypt/live/kfata.elsaidy.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kfata.elsaidy.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    client_max_body_size 7m;
    access_log /var/log/nginx/kfata-access.log;
    error_log /var/log/nginx/kfata-error.log;
    proxy_set_header Host kfata.elsaidy.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    location ~ ^/(admin/login|django-admin/login)/ {
        limit_req zone=kfata_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8097;
    }
    location / {
        proxy_pass http://127.0.0.1:8097;
        proxy_set_header Host kfata.elsaidy.org;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 50s;
    }
}
