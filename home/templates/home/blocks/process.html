<section class="section process-section reveal tone-{{ value.tone|default:'dark' }}"><div class="section-title"><h2>{{ value.title }}</h2>{% if value.introduction %}<p>{{ value.introduction }}</p>{% endif %}</div><ol class="process-steps">{% for step in value.steps %}<li><span class="step-number" aria-hidden="true">{{ forloop.counter|stringformat:'02d' }}</span><h3>{{ step.title }}</h3><p>{{ step.text }}</p></li>{% endfor %}</ol></section>
