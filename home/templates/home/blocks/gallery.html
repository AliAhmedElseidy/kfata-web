{% load wagtailimages_tags %}<section class="section gallery-section tone-{{ value.tone|default:'dark' }}">{% if value.title %}<div class="section-title"><h2>{{ value.title }}</h2><span aria-hidden="true">↗</span></div>{% endif %}<div class="gallery" data-gallery>{% for item in value.images %}{% image item.image max-1800x1400 as full %}<figure><a href="{{ full.url }}" data-gallery-image data-caption="{{ item.caption|default:item.image.title }}" aria-label="{% if language == 'ar' %}تكبير الصورة:{% else %}Enlarge image:{% endif %} {{ item.caption|default:item.image.title }}">{% image item.image fill-800x650 loading='lazy' %}<span class="zoom-mark" aria-hidden="true">＋</span></a>{% if item.caption %}<figcaption>{{ item.caption }}</figcaption>{% endif %}</figure>{% endfor %}</div></section>
