{% load wagtailimages_tags %}<section class="section reveal">{% if value.title %}<h2>{{ value.title }}</h2>{% endif %}<div class="gallery">{% for item in value.images %}<figure><a href="{{ item.image.file.url }}" aria-label="{{ item.caption|default:item.image.title }}">{% image item.image width-1200 loading='lazy' %}</a>{% if item.caption %}<figcaption>{{ item.caption }}</figcaption>{% endif %}</figure>{% endfor %}</div></section>
