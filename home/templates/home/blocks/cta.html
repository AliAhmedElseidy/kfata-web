{% load wagtailcore_tags %}<section class="section"><div class="cta reveal"><div><p class="eyebrow">LET’S BUILD SOMETHING THAT LASTS</p><h2>{{ value.title }}</h2><p>{{ value.text }}</p></div>{% if value.page.live and not value.page.get_view_restrictions.exists %}<a class="button" href="{% pageurl value.page %}">{{ value.button_label }} ↗</a>{% elif not value.page %}<a class="button" href="{% url 'quote' %}?lang={{ language }}">{{ value.button_label }} ↗</a>{% endif %}</div></section>
