{% load site_tags %}{% curated_cards page.locale value as entries %}{% if entries %}<section class="section curated curated-{{ value.kind }} reveal tone-{{ value.tone|default:'dark' }}"><div class="section-title"><div><p class="eyebrow">KFATA / {{ value.kind|upper }}</p><h2>{{ value.title }}</h2></div>{% if value.introduction %}<p>{{ value.introduction }}</p>{% endif %}</div><div class="{% if value.kind == 'project' %}project-grid project-showcase{% elif value.kind == 'service' %}service-list{% elif value.kind == 'sector' %}sector-list{% else %}project-grid{% endif %}">{% for item in entries %}{% include 'home/card.html' %}{% endfor %}</div></section>{% endif %}
