{% load wagtailcore_tags wagtailimages_tags %}<section class="hero block-hero">{% if value.image %}{% image value.image fill-1600x900 as hero %}<img class="hero-image" src="{{ hero.url }}" width="{{ hero.width }}" height="{{ hero.height }}" alt="{{ value.image.title }}" loading="lazy">{% endif %}<div class="hero-shade"></div><div class="hero-copy"><h2>{{ value.title }}</h2><p>{{ value.text }}</p>{% if value.page.live and not value.page.get_view_restrictions.exists %}<a class="button" href="{% pageurl value.page %}">{{ value.button_label|default:value.page.title }}</a>{% endif %}</div></section>
