name: kfata-web
services:
  web:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KFATA_LOCAL_PORT:-8097}:8000"
    volumes:
      - media:/app/media
      - private_media:/app/private-media
    networks: [kfata]
    mem_limit: ${WEB_MEMORY:-768m}
    cpus: ${WEB_CPUS:-1.0}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/',headers={'Host':os.environ.get('ALLOWED_HOSTS','kfata.elsaidy.org').split(',')[0],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [kfata]
    mem_limit: ${DB_MEMORY:-512m}
    cpus: ${DB_CPUS:-0.75}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  kfata: {}
volumes:
  database: {}
  media: {}
  private_media: {}
